[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-claude-plugin"
dynamic = ["version"]
description = "Anthropic Claude plugin for OpenVoiceOS — chat, multimodal, summarisation, NLU, and memory engines"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "OpenVoiceOS", email = "jarbasai@mailfence.com"}]
requires-python = ">=3.9"
keywords = [
    "ovos",
    "plugin",
    "claude",
    "anthropic",
    "llm",
    "chat",
    "persona",
    "voice-assistant",
]
dependencies = [
    "anthropic>=0.20.0",
    "ovos-plugin-manager>=2.2.3a1,<3.0.0",
    "sentence-stream",
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-claude-plugin"
Repository = "https://github.com/OpenVoiceOS/ovos-claude-plugin"

# ── Agent engine entry points ──────────────────────────────────────────────

[project.entry-points."opm.agents.chat"]
ovos-chat-claude-plugin = "ovos_claude.chat:ClaudeChatEngine"
ovos-chat-claude-code-plugin = "ovos_claude.chat:ClaudeCodeChatEngine"

[project.entry-points."opm.agents.chat.multimodal"]
ovos-chat-multimodal-claude-plugin = "ovos_claude.multimodal:ClaudeMultimodalChatEngine"

[project.entry-points."opm.agents.summarizer"]
ovos-summarizer-claude-plugin = "ovos_claude.summarizer:ClaudeSummarizerEngine"

[project.entry-points."opm.agents.summarizer.chat"]
ovos-chat-summarizer-claude-plugin = "ovos_claude.summarizer:ClaudeChatSummarizerEngine"

[project.entry-points."opm.agents.coref"]
ovos-coref-claude-plugin = "ovos_claude.coref:ClaudeCoreferenceEngine"

[project.entry-points."opm.agents.reranker"]
ovos-reranker-claude-plugin = "ovos_claude.reranker:ClaudeReRankerEngine"

[project.entry-points."opm.agents.extractive_qa"]
ovos-extractive-qa-claude-plugin = "ovos_claude.qa:ClaudeExtractiveQAEngine"

[project.entry-points."opm.agents.nli"]
ovos-nli-claude-plugin = "ovos_claude.nli:ClaudeNLIEngine"

[project.entry-points."opm.agents.yesno"]
ovos-yesno-claude-plugin = "ovos_claude.nli:ClaudeYesNoEngine"

[project.entry-points."opm.agents.memory"]
ovos-memory-claude-plugin = "ovos_claude.memory:ClaudeContextManager"

# ── Persona entry points ──────────────────────────────────────────────────

[project.entry-points."opm.plugin.persona"]
Claude = "ovos_claude_persona:CLAUDE_PERSONA"

# ── Transformer entry points ───────────────────────────────────────────────

[project.entry-points."opm.transformer.text"]
ovos-utterance-transformer-claude-plugin = "ovos_claude.transformers:ClaudeUtteranceTransformer"

[project.entry-points."opm.transformer.dialog"]
ovos-dialog-transformer-claude-plugin = "ovos_claude.transformers:ClaudeDialogTransformer"

# ── Package discovery ──────────────────────────────────────────────────────

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["ovos_claude*"]

[tool.setuptools.dynamic]
version = {attr = "ovos_claude.version.__version__"}

[tool.pytest.ini_options]
testpaths = ["test/unittests"]
